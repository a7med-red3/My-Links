<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/Full Stack.css">
    <link rel="icon" href="../assist/img/AR.svg" type="image/svg+xml">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Ahmed Reda</title>
</head>

<body>

    <button id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>


    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img src="../assist/img/user.JPG" alt="">
                </div>
                <h2>Ahmed</h2>
            </li>

            <li>
                <a class="home" href="../index.html">
                    <i class="fas fa-home"></i>
                    <p>Home</p>
                </a>
            </li>

            <li>
                <a class="fullstack" href="../html/Full Stack.html">
                    <i class="fas fa-user-group"></i>
                    <p>Full Stack</p>
                </a>
            </li>

            <li>
                <a class="graphic" href="../html/Graphic.html">
                    <i class="fas fa-table"></i>
                    <p>Graphic Design</p>
                </a>
            </li>

            <li>
                <a class="contact" href="../html/Contact.html">
                    <i class="fas fa-envelope"></i>
                    <p>Contact</p>
                </a>
            </li>

            <li class="share">
                <a href="#" class="share-trigger" onclick="toggleShareMenu(true)" title="Share Profile">
                    <i class="fas fa-share-nodes"></i>
                    <p>Share</p>
                    
                </a>                
            </div>
            </li>
        </ul>

        <div id="share-menu" class="call-menu-overlay" onclick="toggleShareMenu(false)">
            <div class="call-menu-content" onclick="event.stopPropagation()">
                <h3>Share My Card</h3>
                
                <div id="qrcode-container">
                    <img id="qr-code" src="" alt="QR Code">
                </div>
                
                <div class="share-actions">
                    <button class="num-link" onclick="copyToClipboard()">
                        <span id="copy-text">Copy Link</span>
                    </button>
                </div>
                <button class="close-btn" onclick="toggleShareMenu(false)">Close</button>
            </div>
        </div>
    </div>

    <header class="top">
        <p class="rocket">🚀</p>
        <h1>Coming Soon..</h1>
        <h3>Building something awesome....</h3>
    </header>

    <script>

        const menu = document.querySelector(".menu");
        const btn = document.getElementById("menu-toggle");

        btn.onclick = () => {
            menu.classList.toggle("active");
        }

        document.addEventListener("click", function (e) {

            if (
                window.innerWidth <= 768 &&
                !menu.contains(e.target) &&
                !btn.contains(e.target)
            ) {
                menu.classList.remove("active");
            }

        });

        
        // =====================

        function toggleShareMenu(open) {
            const menu = document.getElementById('share-menu');
            const qrImg = document.getElementById('qr-code');
            if(open) {
                const currentUrl = window.location.href;
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;
                
                menu.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } else {
                menu.style.display = 'none';
                document.body.style.overflow = 'auto';
                document.getElementById('copy-text').innerText = "Copy Link";
            }
        }

        function copyToClipboard() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                const copyText = document.getElementById('copy-text');
                copyText.innerText = "Copied! ✅";
                setTimeout(() => {
                    copyText.innerText = "Copy Link";
                }, 2000);
            });
        }

        function openMenu(menu) {
            menu.style.display = 'flex'; 
        }

        function closeMenu(menu) {
            menu.style.display = 'none';
        }
    </script>

</body>
</html>
